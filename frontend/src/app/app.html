<div style="padding: 40px; font-family: sans-serif; color: #333; max-width: 600px; margin: 0 auto;">
  <h1 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">Task Tracker</h1>
  <div style="margin-top: 20px;">
    @for (task of tasks; track task.id) {
      <div style="background: #f4f4f9; border-left: 5px solid #007bff; padding: 15px; margin-bottom: 12px; border-radius: 4px;">
        <h3 style="margin: 0 0 8px 0; color: #111;">🎯 {{ task.title }}</h3>
        <p style="margin: 0; font-size: 14px; color: #666;">
          <strong>Status:</strong> {{ task.completed ? '✅ Done' : '⏳ Pending' }}
        </p>
      </div>
    } @empty {
      <p style="color: #888; font-style: italic;">No tasks found in the database.</p>
    }
  </div>
</div>
