services:

  db:
    image: postgres:latest
    container_name: task-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: ./backend
    container_name: task-tracker-backend
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: task-tracker-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data: